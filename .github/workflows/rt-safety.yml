name: Real-Time Safety

# clang RealtimeSanitizer over the EQ's audio-thread DSP (processEq and below). Catches any
# malloc/lock/syscall on the audio callback that would cause dropouts in a host.
# (pluginval host-contract validation already runs in ci.yml at strictness 10, so it is not
# duplicated here — this workflow adds only the real-time-safety layer.)
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  rtsan:
    name: RTSan (clang-20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same JUCE Linux deps as ci.yml (ALSA/JACK/X11/freetype/GL headers).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxext-dev \
            libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libcurl4-openssl-dev

      # RealtimeSanitizer (-fsanitize=realtime) needs clang >= 20; ubuntu ships older, so
      # install from apt.llvm.org. This provides clang-20 / clang++-20 + the compiler-rt runtime.
      - name: Install clang 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Cache JUCE source
        uses: actions/cache@v4
        with:
          path: build-rt/_deps
          key: juce-src-rtsan-${{ hashFiles('CMakeLists.txt') }}

      - uses: lukka/get-cmake@latest

      - name: Configure (clang-20, RTSan)
        run: >
          cmake -B build-rt -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-20
          -DCMAKE_CXX_COMPILER=clang++-20
          -DZEQ_RT_SANITIZE=ON
          -DZEQ_BUILD_STANDALONE=OFF

      - name: Build ZandersEQRtCheck
        run: cmake --build build-rt --target ZandersEQRtCheck --parallel "$(nproc)"

      # halt_on_error=1 → the first RT-safety violation prints its stack and fails the job.
      # xvfb provides a virtual display for the linked GUI/OpenGL modules (no editor is opened).
      - name: Run under RealtimeSanitizer
        env:
          RTSAN_OPTIONS: "halt_on_error=1:suppressions=${{ github.workspace }}/tests/rtsan_suppressions.txt"
        run: |
          BIN=build-rt/ZandersEQRtCheck
          [ -x "$BIN" ] || BIN=$(find build-rt -type f -name ZandersEQRtCheck | head -1)
          xvfb-run -a "$BIN"
