sonar.projectKey=zandersdaw_eq
sonar.organization=zandersdaw
sonar.projectName=ZandersEQ
sonar.projectVersion=0.1.0

# Analysis scope
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C/C++ config via CMake compilation database (generated with CMAKE_EXPORT_COMPILE_COMMANDS=ON)
sonar.cfamily.compile-commands=build/compile_commands.json

# Coverage: Sonar generic format emitted by `gcovr --sonarqube`
sonar.coverageReportPaths=coverage.xml

# Coverage scope: the GUI (paint/layout) and the editor are verified by eye, not unit
# tests — asserting on pixel geometry is brittle and low-value. Parameters.h is the
# declarative APVTS layout: its lines are exercised at construction (line coverage is
# full), but its branch count is dominated by inlined JUCE String/make_unique template
# machinery that isn't meaningfully unit-testable. Exclude these so the new-code
# coverage gate reflects the genuinely testable DSP/engine code.
sonar.coverage.exclusions=src/gui/**,src/PluginEditor.cpp,src/PluginEditor.h,src/Parameters.h
